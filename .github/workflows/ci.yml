name: CI

# Mirrors the Woodpecker quality gate (.woodpecker/check.yml) so its result is a
# GitHub-visible status check, usable by branch protection and PR gating. The
# toolchain (channel + rustfmt/clippy components) is resolved from
# rust-toolchain.toml by rustup, so no explicit component installs are needed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy --workspace -- -D warnings

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo check --workspace

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --workspace

  # The generated workflow files (.claude/agents/fe-*, .claude/skills/fe-*,
  # the hooks) match .ferrule/ferrule.lock and the ferrule version pinned in
  # .ferrule/ferrule.toml. The release binary of that pin is downloaded and
  # checked against its published checksum.
  workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned ferrule release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' .ferrule/ferrule.toml)
          asset="ferrule_v${version}_x86_64-unknown-linux-musl.zip"
          url="https://github.com/TumbleOwlee/ferrule/releases/download/v${version}"
          curl -fsSLO "$url/$asset" -O "$url/$asset.sha256sum"
          sha256sum -c "$asset.sha256sum"
          mkdir -p "$HOME/.local/bin" && unzip -qo "$asset" ferrule -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ferrule install --check

  # Advisories, licenses, and banned/duplicate crates. Policy lives in deny.toml.
  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 80
