name: CI

# Mirrors the Woodpecker quality gate (.woodpecker/check.yml) so its result is a
# GitHub-visible status check, usable by branch protection and PR gating. The
# toolchain (channel + rustfmt/clippy components) is resolved from
# rust-toolchain.toml by rustup, so no explicit component installs are needed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy --workspace -- -D warnings

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo check --workspace

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --workspace

  # The generated workflow files (.claude/agents/fe-*, .claude/skills/fe-*,
  # the hooks) match .ferrule/ferrule.lock and the ferrule version pinned in
  # .ferrule/ferrule.toml; the tag and the cache key move with that pin.
  # ferrule publishes no release binaries, so the built one is cached.
  workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: ferrule-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/ferrule
          key: ferrule-v0.1.0-${{ runner.os }}
      - if: steps.ferrule-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/TumbleOwlee/ferrule --tag v0.1.0 --locked ferrule
      - run: ferrule install --check

  # Advisories, licenses, and banned/duplicate crates. Policy lives in deny.toml.
  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 80
