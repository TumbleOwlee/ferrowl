when:
  - event: push
  - event: pull_request
  - event: manual

steps:
  fmt:
    image: rust:latest
    commands:
      - rustup component add rustfmt
      - cargo fmt --check

  clippy:
    image: rust:latest
    commands:
      - rustup component add clippy
      - cargo clippy --workspace -- -D warnings

  check:
    image: rust:latest
    commands:
      - cargo check --workspace

  test:
    image: rust:latest
    commands:
      - cargo test --workspace

  # The generated workflow files match .ferrule/ferrule.lock and the ferrule
  # version pinned in .ferrule/ferrule.toml; the tag moves with that pin.
  workflow:
    image: rust:latest
    commands:
      - cargo install --git https://github.com/TumbleOwlee/ferrule --tag v0.1.0 --locked ferrule
      - ferrule install --check

  # Advisories, licenses, and banned/duplicate crates. Policy lives in deny.toml.
  deny:
    image: rust:latest
    commands:
      - cargo install cargo-deny --locked
      - cargo deny check

  coverage:
    image: rust:latest
    commands:
      - rustup component add llvm-tools-preview
      - cargo install cargo-llvm-cov --locked
      - cargo llvm-cov --workspace --fail-under-lines 80
