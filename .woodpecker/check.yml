when:
  - event: push
  - event: pull_request
  - event: manual

steps:
  fmt:
    image: rust:latest
    commands:
      - rustup component add rustfmt
      - cargo fmt --check

  clippy:
    image: rust:latest
    commands:
      - rustup component add clippy
      - cargo clippy --workspace -- -D warnings

  check:
    image: rust:latest
    commands:
      - cargo check --workspace

  test:
    image: rust:latest
    commands:
      - cargo test --workspace

  # The generated workflow files match .ferrule/ferrule.lock and the ferrule
  # version pinned in .ferrule/ferrule.toml. The release binary of that pin
  # is downloaded and checked against its published checksum.
  workflow:
    image: rust:latest
    commands:
      - version=$(sed -n 's/^version = "\(.*\)"/\1/p' .ferrule/ferrule.toml)
      - asset="ferrule_v$${version}_x86_64-unknown-linux-musl.zip"
      - url="https://github.com/TumbleOwlee/ferrule/releases/download/v$${version}"
      - curl -fsSLO "$$url/$$asset" -O "$$url/$$asset.sha256sum"
      - sha256sum -c "$$asset.sha256sum"
      - mkdir -p "$$HOME/.local/bin" && unzip -qo "$$asset" ferrule -d "$$HOME/.local/bin"
      - $$HOME/.local/bin/ferrule install --check

  # Advisories, licenses, and banned/duplicate crates. Policy lives in deny.toml.
  deny:
    image: rust:latest
    commands:
      - cargo install cargo-deny --locked
      - cargo deny check

  coverage:
    image: rust:latest
    commands:
      - rustup component add llvm-tools-preview
      - cargo install cargo-llvm-cov --locked
      - cargo llvm-cov --workspace --fail-under-lines 80
