[package]
name = "ferrowl-util"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
futures-util = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# The `#[tokio::test]`/`#[tokio::test(start_paused = true)]` tests in `backoff.rs` need the
# macro and paused-time control, which the library itself does not depend on. They all run
# current-thread (the default), so no multi-thread runtime feature is pulled in here.
tokio = { workspace = true, features = ["macros", "test-util"] }
